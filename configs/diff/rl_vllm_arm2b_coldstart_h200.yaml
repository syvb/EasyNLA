# Phase 3 — Optional Arm 2b (Cold-Start Diff-NLA, NO Warm-Start SFT) on 4xH200 141GB
# Starts directly from raw Qwen/Qwen3-8B AV + identity-init 25-layer AR (scripts/init_coldstart_ar.py).
# disable_av_thinking=true ensures Qwen3-8B emits <explanation> directly without spending
# its 256-token budget inside <think>...</think> before any SFT has occurred.
# IMPORTANT: Pass `--soft-norm-tau <tau_web_median>` from phase0_config.json on CLI!

evals: [base_fve, text_judges]
train_critic: true

lr: 1.0e-4
critic_lr: 8.0e-5
num_steps: 200
batch_prompts: 256
group_size: 8
max_new_tokens: 256
length_penalty: 0.01
temperature: 1.0

lora_r: 128
lora_alpha: 16
use_rslora: true

soft_norm_tau: 0.0
fail_reward: -2.0
disable_av_thinking: true

vllm_tp: 1
vllm_max_len: 1024
vllm_gpu_mem: 0.35
ipc_weight_sync: true

eval_every: 10
eval_n_prompts: 128
eval_temperature: 0.0
text_judges_every: 50
save_every: 100
save_steps: [0, 50, 100, 200]
save_critic_at_ckpts: true

wandb_project: easynla-diff-qwen3-8b
wandb_group: diff-rl
wandb_name: arm2b_coldstart_diff
wandb_tags: diff_study,arm2b,coldstart
