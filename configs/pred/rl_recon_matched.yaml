# Compute-matched reconstruction arm: the SAME trainer, the SAME rollouts, the
# SAME LoRA and step count as configs/pred/rl_behavioral.yaml - only the reward
# differs (-MSE from the frozen AR instead of frozen-reader gain).
#
# Why bother when a published reconstruction-RL checkpoint exists: that
# checkpoint is a rank-16 attention-only adapter from a run of unknown length,
# so "behavioral beat reconstruction" against it could just mean the two runs
# were configured differently. This arm removes that objection. It costs about
# the same as the behavioral run.
#
# python -m nla.pred.train_rl --config configs/pred/rl_recon_matched.yaml \
#     --positions <positions.parquet> --save-dir <ckpts>/recon_matched

reward: recon
base_ckpt: syvb/nanonla-qwen3-8b-L24-av
ar_ckpt: syvb/nanonla-qwen3-8b-L24-ar    # frozen, matching the published comparator

num_steps: 300
batch_prompts: 32
group_size: 8
lr: 1.0e-5
lora_r: 32
lora_alpha: 16
use_rslora: true
kl_beta: 0.02

max_new_tokens: 192
length_threshold: 160
length_penalty: 0.01            # the reconstruction reward's own scale (~0.5)

gen_batch: 64
logp_micro_batch: 2
quant: none

eval_every: 10
eval_n_positions: 200
save_every: 50
wandb_project: pred-nla
wandb_group: rl
wandb_name: recon_matched
seed: 0
