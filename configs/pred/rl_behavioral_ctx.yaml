# Behavioral RL, CONTEXT-CONDITIONED reward: identical to rl_behavioral.yaml
# except the reader is also shown the last 64 words of the document in both
# prompts. Without that, a verbatim quote of the prefix out-scores a real
# explanation (measured on gold explanations), so the context-free reward can
# be earned by learning to quote. This is the arm the docs recommend.

reward: reader_gain
base_ckpt: syvb/nanonla-qwen3-8b-L24-av
reader: Qwen/Qwen3-4B-Base      # TRAINING reader. Gemma is held out and never loaded here.
branches: 4                     # continuation branches averaged per position

# --- optimization ---
num_steps: 300                  # ~1 epoch of a 10k-position pool at 32 prompts/step
batch_prompts: 32
group_size: 8                   # 4 gives a noisy group baseline; rollouts are cheap here
lr: 1.0e-5
lora_r: 32
lora_alpha: 16
use_rslora: true
kl_beta: 0.02                   # toward the SFT init

# Explanation budget. The SFT policy writes a median 119 tokens (p99 149), so a
# 128 cap would truncate a fifth of its own explanations and the first thing RL
# learned would be brevity. 192 leaves headroom; the hinge applies gentle
# pressure from 160 up.
max_new_tokens: 192
length_threshold: 160
# In REWARD units. Gold explanations score ~0.3-1.0 nats/token on a base reader
# with a within-position spread of ~0.25 (probe), so 0.005/token past the
# hinge is ~0.16 at the cap: felt, not dominant. Check it against the
# gate's observed reward SD before trusting it.
length_penalty: 0.005
fail_gain: 0.5                  # logged/eval floor only; failures get --fail-advantage, not a place in the group std
reward_context_words: 64        # the reader also sees the last 64 words of the document

# --- throughput ---
gen_batch: 64                   # rollouts batched ACROSS prompts, not one at a time
logp_micro_batch: 4          # ~35 GB peak at 2 on an 80 GB card; 4 is still comfortable
reader_batch_rows: 48
reader_batch_tokens: 49152
quant: none                     # bf16: the policy is 8B and the reader 4B

# --- eval / io ---
eval_every: 25
eval_n_positions: 400           # held-out val positions, TRAINING reader only
save_every: 50
wandb_project: pred-nla
wandb_group: rl
wandb_name: behavioral_rl_ctx
seed: 0
