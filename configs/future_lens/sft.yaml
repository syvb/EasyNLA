# Future-lens SFT warm-start (nla.train_sft --mode av --future-lens), Qwen3-8B, 1x H100/A100 80GB.
# Keys are argparse dests. CLI flags override. Pass --parquet/--heldout-parquet/--save-dir/--base-ckpt.
mode: av
label: greedy                 # Future Lens convention: read out the target's own greedy continuation
future_lens: true
injection: replace_embed      # ablation arm: karvonen
alpha_mult: 1.0               # alpha sweep: 0.5 / 1 / 2 / 4
use_lora: true
lora_r: 64
lora_alpha: 16                # rsLoRA is ON in train_sft: scale = alpha/sqrt(r) = 2.0 (repo default r128/a16 = 1.4)
quant: none
layers: "8,12,16,20,24,28,32"   # layer 4 is collected for the wrong-layer control only                   # bf16 base; 8B fits on 48-80 GB with LoRA
batch_size: 32
gradient_accumulation_steps: 2  # eff. batch 64 rows (~15 readout tokens each)
lr: 1.0e-4
min_lr: 1.0e-5
lr_warmup_steps: 600          # spec: 3% of the ~20k-step epoch (1.3M rows / eff. batch 64)
max_grad_norm: 1.0
max_len: 128                  # prompt ~60 tokens + readout <= 10
gradient_checkpointing: false
heldout_rows: 512
heldout_every: 500
heldout_gen_rows: 256
heldout_gen_batch: 64
sample_every: 1000
n_samples: 4
sample_max_new_tokens: 12
save_every: 2000
wandb_project: rl-future-lens
wandb_group: sft
