# Continuous-bottleneck experiment config (box paths assume /workspace layout
# created by setup_box.sh). All scripts take --config with this file.

# --- models ---
m_ckpt: Qwen/Qwen3-8B          # target model M (loaded via HF hub cache)
av_merged_dir: /workspace/nlabtl/av_merged   # RL LoRA merged into warmstart base (merge_av.py)
ar_dir: /workspace/nlabtl/ar_ckpt            # NLACriticModel dir (25 layers + value_head)
layer_index: 24                # sidecar-pinned; codec asserts agreement

# --- codec (AV/AR) ---
vllm_gpu_mem: 0.35             # fraction of TOTAL GPU mem for vLLM (H200: ~49GB).
                               # HF side needs M(16G) + AR(11.5G) + activations.
vllm_max_len: 1024
av_max_tokens: 150             # the checkpoint's RL generation cap
av_temperature: 1.0            # as trained; z_i sampling is the stochasticity in C1

# --- stage A ---
domains_parquet: /workspace/nlabtl/domains.parquet
stage_a_seq_len: 256
stage_a_seqs_per_domain: 32    # INITIAL RUN (halved); full design: 64. Still
                               # ~8k positions/domain — per-token stats stay tight.
stage_a_batch_size: 8
stage_a_seed: 0
store_z: true                  # keep the full z corpus (deliverable)

# --- stage B ---
gen_batch_size: 192            # cohort size. Each M decode step = ONE synchronous
                               # vLLM generate() over the active rows, so per-step
                               # fixed cost (engine scheduling, steer-log RPCs)
                               # amortizes with batch; 64 was ~2-3x slower overall.
data_seed: 0                   # problem subsampling seed (same set for all conditions)

# INITIAL RUN sizing (halves C1 wall time; see README "Initial run"):
#  - sizes cohort-aligned (a 200-problem task costs TWO full cohorts; 192 costs
#    one — steps, not problems, are the cost unit)
#  - mgsm trimmed to en/fr/zh (same-item contrast kept; ru/sw deferred)
#  - humaneval capped at 384 gen tokens (completions rarely need 512)
# For the FULL design: delete task_sizes/mgsm_langs/max_new_caps below and run
# the deferred tasks (math500, mbpp, ifeval) + seed 2 + nla_prompt.
task_sizes: {gsm8k: 192, gsm8k_short: 192, triviaqa: 192, popqa: 192, mgsm: 64}
mgsm_langs: [en, fr, zh]
max_new_caps: {humaneval: 384}

# --- output ---
out_dir: /workspace/nlabtl/results
